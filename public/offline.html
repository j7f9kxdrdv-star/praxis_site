<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003630" />
    <title>Offline — Praxist Prep</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf7f2;
        color: #003630;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { max-width: 340px; text-align: center; }
      .badge {
        width: 76px; height: 76px; margin: 0 auto 22px;
        border-radius: 20px; display: grid; place-items: center;
        background: #003630;
      }
      .badge img { width: 48px; height: 48px; display: block; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.01em; }
      p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: #4a5a54; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #003630; color: #faf7f2;
        font-size: 15px; font-weight: 600;
        padding: 12px 26px; border-radius: 999px;
        font-family: inherit;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge"><img src="/icon-192.png" alt="Praxist Prep" /></div>
      <h1>You're offline</h1>
      <p>Praxist needs a connection to load new material. Check your network and try again — your progress is safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
